<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talking Witch 🔮</title>
    <style>
        :root {
            --bg-color: #0b071e;
            --panel-bg: #191238;
            --accent-purple: #9b59b6;
            --accent-green: #2ecc71;
            --text-color: #f3f0ff;
            --glow: 0 0 15px rgba(155, 89, 182, 0.6);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            border: 2px solid var(--accent-purple);
            border-radius: 16px;
            box-shadow: var(--glow);
            padding: 30px;
            text-align: center;
            box-sizing: border-box;
            margin: 20px;
        }

        h1 {
            margin-top: 0;
            color: #d7bde2;
            font-size: 2.2rem;
            text-shadow: 0 0 10px var(--accent-purple);
        }

        .witch-avatar {
            font-size: 5rem;
            margin: 10px 0;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .chat-box {
            background: #100b24;
            border: 1px solid #4a235a;
            border-radius: 8px;
            height: 150px;
            overflow-y: auto;
            padding: 15px;
            text-align: left;
            margin-bottom: 20px;
            font-size: 1.05rem;
            line-height: 1.4;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--accent-purple);
            background: #0b071e;
            color: var(--text-color);
            font-size: 1rem;
        }

        input[type="text"]:focus {
            outline: none;
            box-shadow: var(--glow);
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: var(--accent-purple);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }

        button:hover {
            background: #8e44ad;
            box-shadow: var(--glow);
        }

        .speaking {
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Talking Witch</h1>
        <div class="witch-avatar" id="avatar">🧙‍♀️</div>
        <p>Ask the oracle a question about your destiny...</p>

        <div class="chat-box" id="chatBox">
            <strong>Witch:</strong> Hehehe... Step closer, mortal. What knowledge do you seek from the shadows?
        </div>

        <div class="input-group">
            <input type="text" id="userInput" placeholder="Ask the witch a question..." autofocus>
            <button onclick="askWitch()">Consult</button>
        </div>
    </div>

    <script>
        const witchResponses = [
            "Hehehe... The crystal ball shows murky paths ahead. Beware of strangers bearing shiny trinkets!",
            "Ah, the spirits whisper your name... They say fortune favors the bold, but patience keeps your fingers attached.",
            "Cackle! Your future is as clear as muddy swamp water. Expect surprises before the next full moon.",
            "The cards don't lie, traveler! Romance is brewing, but so is a bitter potion of drama.",
            "I see gold in your future... or perhaps it's just fool's gold. Only time will tell, mwahaha!",
            "Tread carefully! A black cat crosses your path soon, bringing either great luck or a heavy sneeze."
        ];

        // Trigger on Enter key
        document.getElementById("userInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                askWitch();
            }
        });

        function askWitch() {
            const inputField = document.getElementById("userInput");
            const chatBox = document.getElementById("chatBox");
            const avatar = document.getElementById("avatar");
            const userText = inputField.value.trim();

            if (!userText) return;

            // Display user question
            chatBox.innerHTML += <br><br><strong>You:</strong> ${userText};
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Pick a random witch response
            const randomReply = witchResponses[Math.floor(Math.random() * witchResponses.length)];

            // Display witch response
            setTimeout(() => {
                chatBox.innerHTML += <br><br><strong>Witch:</strong> ${randomReply};
                chatBox.scrollTop = chatBox.scrollHeight;
                
                // Speak the response out loud
                speakText(randomReply, avatar);
            }, 600);
        }

        function speakText(text, avatarElement) {
            if ('speechSynthesis' in window) {
                // Stop any ongoing speech
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = 0.6; // Deep, spooky voice
                utterance.rate = 0.9;  // Slightly slower cadence

                // Animate avatar while speaking
                utterance.onstart = () => avatarElement.classList.add('speaking');
                utterance.onend = () => avatarElement.classList.remove('speaking');
                utterance.onerror = () => avatarElement.classList.remove('speaking');

                window.speechSynthesis.speak(utterance);
            }
        }
    </script>

</body>
</html>
