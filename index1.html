<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickPOS System</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Main Layout */
    .pos-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Products Section (Left) */
    .products-section {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .header {
      margin-bottom: 20px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 15px;
    }

    .product-card {
      background: #fff;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      border: 1px solid #eef0f3;
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .product-card:active {
      transform: scale(0.98);
    }

    .product-name {
      font-weight: 600;
      margin-bottom: 8px;
    }

    .product-price {
      color: #27ae60;
      font-weight: bold;
    }

    /* Cart Section (Right) */
    .cart-section {
      width: 380px;
      background: #fff;
      border-left: 1px solid #e1e4e8;
      display: flex;
      flex-direction: column;
    }

    .cart-header {
      padding: 20px;
      border-bottom: 1px solid #e1e4e8;
      background: #fafbfc;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .cart-item-details {
      flex: 1;
    }

    .cart-item-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .cart-item-subtotal {
      font-size: 0.85rem;
      color: #666;
    }

    .cart-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-qty {
      background: #eef0f3;
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-qty:hover {
      background: #ddd;
    }

    /* Footer / Total Calculation */
    .cart-footer {
      padding: 20px;
      border-top: 1px solid #e1e4e8;
      background: #fafbfc;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .summary-row.total {
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 12px;
      border-top: 2px dashed #ddd;
      padding-top: 10px;
    }

    .btn-checkout {
      width: 100%;
      background: #27ae60;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .btn-checkout:hover {
      background: #219150;
    }

    .btn-checkout:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      max-width: 350px;
      width: 100%;
    }

    .btn-close {
      margin-top: 20px;
      background: #333;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="pos-container">
    <!-- Catalog Section -->
    <div class="products-section">
      <div class="header">
        <h2>QuickPOS Catalog</h2>
      </div>
      <div class="product-grid" id="productGrid"></div>
    </div>

    <!-- Checkout Cart Section -->
    <div class="cart-section">
      <div class="cart-header">
        <h3>Current Order</h3>
      </div>
      <div class="cart-items" id="cartItems">
        <p style="color: #888; text-align: center; margin-top: 20px;">Cart is empty</p>
      </div>
      <div class="cart-footer">
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotalAmount">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Tax (10%)</span>
          <span id="taxAmount">$0.00</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="totalAmount">$0.00</span>
        </div>
        <button class="btn-checkout" id="checkoutBtn" onclick="processCheckout()" disabled>Complete Sale</button>
      </div>
    </div>
  </div>

  <div class="add-product-form" style="margin-top: 20px; background: #fff; padding: 15px; border-radius: 8px;">
  <h3>Add New Product</h3>
  <div style="display: flex; gap: 10px; margin-top: 10px;">
    <input type="text" id="newProductName" placeholder="Item Name" style="padding: 8px; flex: 2;">
    <input type="number" id="newProductPrice" placeholder="Price ($)" step="0.01" style="padding: 8px; flex: 1;">
    <button onclick="addNewProductFromForm()" style="padding: 8px 15px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer;">Add</button>
  </div>
</div>

  <!-- Receipt Modal -->
  <div class="modal" id="receiptModal">
    <div class="modal-content">
      <h3>Transaction Complete!</h3>
      <p style="margin-top: 10px;">Total Paid: <strong id="modalTotal">$0.00</strong></p>
      <button class="btn-close" onclick="closeModal()">New Order</button>
    </div>
  </div>

  <script>
    // Product Data
    const products = [
      { id: 1, name: 'Coffee', price: 3.50 },
      { id: 2, name: 'Sandwich', price: 6.00 },
      { id: 3, name: 'Croissant', price: 2.75 },
      { id: 4, name: 'Orange Juice', price: 4.00 },
      { id: 5, name: 'Muffin', price: 3.00 },
      { id: 6, name: 'Tea', price: 2.50 },
      { id: 7, name: 'Water Bottle', price: 1.50 },
      { id: 8, name: 'Salad', price: 7.50 },
      {id : 9, name: 'CoolDrink', price:5.00}
    ];

    let cart = [];
    const TAX_RATE = 0.10;

    // Render Product Grid
    function renderProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = products.map(product => `
        <div class="product-card" onclick="addToCart(${product.id})">
          <div class="product-name">${product.name}</div>
          <div class="product-price">$${product.price.toFixed(2)}</div>
        </div>
      `).join('');
    }

    // Add item to cart
    function addToCart(productId) {
      const existingItem = cart.find(item => item.id === productId);
      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        const product = products.find(p => p.id === productId);
        cart.push({ ...product, quantity: 1 });
      }
      updateCartDisplay();
    }

    // Modify Item Quantity
    function updateQuantity(productId, change) {
      const item = cart.find(item => item.id === productId);
      if (!item) return;

      item.quantity += change;
      if (item.quantity <= 0) {
        cart = cart.filter(i => i.id !== productId);
      }
      updateCartDisplay();
    }

    // Update Totals and Render Cart UI
    function updateCartDisplay() {
      const cartContainer = document.getElementById('cartItems');
      const checkoutBtn = document.getElementById('checkoutBtn');

      if (cart.length === 0) {
        cartContainer.innerHTML = '<p style="color: #888; text-align: center; margin-top: 20px;">Cart is empty</p>';
        checkoutBtn.disabled = true;
      } else {
        cartContainer.innerHTML = cart.map(item => `
          <div class="cart-item">
            <div class="cart-item-details">
              <div class="cart-item-title">${item.name}</div>
              <div class="cart-item-subtotal">$${(item.price * item.quantity).toFixed(2)}</div>
            </div>
            <div class="cart-controls">
              <button class="btn-qty" onclick="updateQuantity(${item.id}, -1)">-</button>
              <span>${item.quantity}</span>
              <button class="btn-qty" onclick="updateQuantity(${item.id}, 1)">+</button>
            </div>
          </div>
        `).join('');
        checkoutBtn.disabled = false;
      }

      // Financial calculations
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const tax = subtotal * TAX_RATE;
      const total = subtotal + tax;

      document.getElementById('subtotalAmount').innerText = `$${subtotal.toFixed(2)}`;
      document.getElementById('taxAmount').innerText = `$${tax.toFixed(2)}`;
      document.getElementById('totalAmount').innerText = `$${total.toFixed(2)}`;
    }

    // Trigger Sale Checkout
    function processCheckout() {
      const total = document.getElementById('totalAmount').innerText;
      document.getElementById('modalTotal').innerText = total;
      document.getElementById('receiptModal').style.display = 'flex';
    }

    // Reset Cart for New Sale
    function closeModal() {
      cart = [];
      updateCartDisplay();
      document.getElementById('receiptModal').style.display = 'none';
    }

    function addProduct(name, price) {
  // Simple ID generation based on array length
  const newProduct = {
    id: products.length + 1,
    name: name,
    price: parseFloat(price)
  };
  
  // Push to the array and refresh the UI grid
  products.push(newProduct);
  renderProducts();
}

function addNewProductFromForm() {
  const nameInput = document.getElementById('newProductName');
  const priceInput = document.getElementById('newProductPrice');

  const name = nameInput.value.trim();
  const price = parseFloat(priceInput.value);

  if (!name || isNaN(price) || price <= 0) {
    alert('Please enter a valid product name and price.');
    return;
  }

  const newProduct = {
    id: Date.now(), // Unique ID using timestamp
    name: name,
    price: price
  };

  products.push(newProduct);
  renderProducts(); // Re-renders grid automatically

  // Reset form inputs
  nameInput.value = '';
  priceInput.value = '';
}

// Example Usage:
// addProduct('Bagel', 3.25);

    // Initial Load
    renderProducts();
  </script>
</body>
</html>
